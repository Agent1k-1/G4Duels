help: |-
  &e/duel <игрок> &7— открыть меню приглашения
  &e/duel <игрок> <own|none|кит> [арена] &7— пригласить
  &e/duel accept <игрок> &7— принять приглашение
  &e/duel deny <игрок> &7— отклонить приглашение
  &e/duel leave &7— сдаться
  &e/duel restore &7— повторить восстановление
admin-help: |-
  &e/duel arena create <имя> &7— создать арену
  &e/duel arena pos1 <имя> &7— первая точка на вашей позиции
  &e/duel arena pos2 <имя> &7— вторая точка на вашей позиции
  &e/duel arena delete <имя> &7— удалить арену
  &e/duel arena list &7— список арен
  &e/duel kit save <имя> &7— сохранить ваш инвентарь как кит
  &e/duel kit delete <имя> &7— удалить кит
  &e/duel kit list &7— список китов
